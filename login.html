<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFBF0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1A1F" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232D2A32'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='%23FF6B6B'/%3E%3C/svg%3E" />
    <title>Iniciar sesión · PopTV</title>
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: calc(var(--space-6) + var(--safe-top)) var(--gutter) calc(var(--space-6) + var(--safe-bottom));
        background: var(--color-bg);
        color: var(--color-text);
        font: var(--text-body);
        -webkit-font-smoothing: antialiased;
      }

      main { width: 100%; max-width: 380px; }

      .brand {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        margin-bottom: var(--space-8);
        font: var(--text-headline);
      }

      .brand svg { width: 36px; height: 36px; flex-shrink: 0; }

      h1 {
        margin: 0 0 var(--space-2);
        font: var(--text-large-title);
        letter-spacing: var(--tracking-tight);
      }

      .lede {
        margin: 0 0 var(--space-8);
        color: var(--color-text-secondary);
        font: var(--text-callout);
      }

      form { display: flex; flex-direction: column; gap: var(--space-5); }

      .field { display: flex; flex-direction: column; gap: 6px; }

      label { font: 600 0.9375rem/1.3 var(--font-sans); }

      .control {
        display: flex;
        align-items: center;
        min-height: 48px;
        padding: 0 6px 0 14px;
        border: 1px solid var(--color-control-border);
        border-radius: var(--radius-md);
        background: var(--color-surface);
        transition:
          border-color var(--duration-fast) var(--ease),
          box-shadow var(--duration-fast) var(--ease);
      }

      .control:focus-within {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px var(--blue-soft);
      }

      .field--invalid .control { border-color: var(--coral-text); }
      .field--invalid .control:focus-within { box-shadow: 0 0 0 3px var(--coral-soft); }

      input {
        flex: 1;
        min-width: 0;
        min-height: 46px;
        padding: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: inherit;
        font: 400 1.0625rem/1.3 var(--font-sans);
      }

      input::placeholder { color: var(--color-placeholder); }

      .reveal {
        min-height: 36px;
        padding: 0 var(--space-3);
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--blue-text);
        font: 600 0.875rem/1 var(--font-sans);
        cursor: pointer;
      }

      .reveal:hover { background: var(--blue-soft); }

      .field__error {
        margin: 0;
        color: var(--coral-text);
        font: 500 0.875rem/1.35 var(--font-sans);
      }

      .field__error:empty { display: none; }

      .form-error {
        margin: 0;
        padding: var(--space-3) var(--space-4);
        border-radius: var(--radius-md);
        background: var(--coral-softer);
        color: var(--coral-text);
        font: 500 0.9375rem/1.4 var(--font-sans);
      }

      .form-error[hidden] { display: none; }

      .submit {
        min-height: var(--control-height-lg);
        margin-top: var(--space-2);
        border: 0;
        border-radius: var(--radius-md);
        background: var(--coral);
        color: var(--color-text-on-accent);
        font: 600 1rem/1.2 var(--font-sans);
        cursor: pointer;
        transition:
          filter var(--duration-fast) var(--ease),
          transform var(--duration-fast) var(--ease);
      }

      .submit:hover:not(:disabled) { filter: brightness(0.97) saturate(1.05); }
      .submit:active:not(:disabled) { transform: scale(0.98); }
      .submit:disabled { opacity: 0.6; cursor: progress; }

      .help {
        margin: var(--space-6) 0 0;
        color: var(--color-text-secondary);
        font: var(--text-footnote);
        font-size: 0.875rem;
        text-align: center;
      }

      :focus-visible {
        outline: 3px solid var(--color-focus);
        outline-offset: 2px;
      }

      input:focus-visible { outline: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#2D2A32" />
          <path d="M12 9l12 7-12 7z" fill="#FF6B6B" />
        </svg>
        <span>PopTV</span>
      </div>

      <h1>Inicia sesión</h1>
      <p class="lede">Entra para administrar clientes, cuentas y cobros.</p>

      <form id="login" novalidate>
        <p class="form-error" id="form-error" role="alert" hidden></p>

        <div class="field" id="field-email">
          <label for="email">Correo</label>
          <div class="control">
            <input
              id="email"
              name="email"
              type="email"
              inputmode="email"
              autocomplete="username"
              autocapitalize="off"
              spellcheck="false"
              placeholder="nombre@ejemplo.com"
              aria-describedby="email-error"
              required
            />
          </div>
          <p class="field__error" id="email-error"></p>
        </div>

        <div class="field" id="field-password">
          <label for="password">Contraseña</label>
          <div class="control">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              aria-describedby="password-error"
              required
            />
            <button type="button" class="reveal" id="reveal" aria-controls="password" aria-pressed="false">
              Mostrar
            </button>
          </div>
          <p class="field__error" id="password-error"></p>
        </div>

        <button type="submit" class="submit" id="submit">Entrar</button>
      </form>

      <p class="help">¿Olvidaste tu contraseña? Pide a quien administra la cuenta que la restablezca.</p>
    </main>

    <script>
      const form = document.getElementById('login');
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const reveal = document.getElementById('reveal');
      const submit = document.getElementById('submit');
      const formError = document.getElementById('form-error');

      reveal.addEventListener('click', () => {
        const showing = password.type === 'text';
        password.type = showing ? 'password' : 'text';
        reveal.textContent = showing ? 'Mostrar' : 'Ocultar';
        reveal.setAttribute('aria-pressed', String(!showing));
        password.focus();
      });

      function setError(input, message) {
        const field = input.closest('.field');
        field.classList.toggle('field--invalid', Boolean(message));
        input.setAttribute('aria-invalid', message ? 'true' : 'false');
        document.getElementById(`${input.id}-error`).textContent = message;
      }

      function validate() {
        const errors = [];
        const emailValue = email.value.trim();
        if (!emailValue) errors.push([email, 'Escribe tu correo.']);
        else if (!email.validity.valid) errors.push([email, 'Revisa el correo; parece incompleto.']);
        if (!password.value) errors.push([password, 'Escribe tu contraseña.']);

        setError(email, errors.find(([el]) => el === email)?.[1] ?? '');
        setError(password, errors.find(([el]) => el === password)?.[1] ?? '');
        return errors;
      }

      // Revalida en vivo solo después de que el campo ya mostró un error.
      [email, password].forEach((input) =>
        input.addEventListener('input', () => {
          if (input.getAttribute('aria-invalid') === 'true') validate();
          formError.hidden = true;
        }),
      );

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        formError.hidden = true;

        const errors = validate();
        if (errors.length) {
          errors[0][0].focus();
          return;
        }

        submit.disabled = true;
        submit.textContent = 'Entrando…';
        try {
          // TODO: conectar con el servicio de autenticación real.
          await new Promise((resolve) => setTimeout(resolve, 600));
          throw new Error('Correo o contraseña incorrectos.');
        } catch (error) {
          formError.textContent = error.message;
          formError.hidden = false;
          password.select();
        } finally {
          submit.disabled = false;
          submit.textContent = 'Entrar';
        }
      });
    </script>
  </body>
</html>
